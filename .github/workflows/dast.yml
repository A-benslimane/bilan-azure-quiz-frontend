name: DAST - OWASP ZAP

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  OWNER_TAG: "abdel-benslimane"
  COMPONENT_TAG: "frontend"
  RESOURCE_GROUP: "abenslimaneRG"

jobs:
  dast:
    name: DAST - OWASP ZAP Frontend Scan
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Connexion Azure avec OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Résoudre l'URL de la Static Web App
        id: target
        shell: bash
        run: |
          STATIC_WEB_APP_NAME=$(az resource list \
            --tag "owner=${OWNER_TAG}" \
            --query "[?type=='Microsoft.Web/staticSites' && tags.component=='${COMPONENT_TAG}'].name | [0]" \
            --output tsv)

          if [ -z "$STATIC_WEB_APP_NAME" ]; then
            echo "Aucune Static Web App trouvée."
            exit 1
          fi

          HOST=$(az staticwebapp show \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostname \
            --output tsv)

          if [ -z "$HOST" ]; then
            echo "Impossible de récupérer le hostname de la Static Web App."
            exit 1
          fi

          echo "url=https://$HOST" >> "$GITHUB_OUTPUT"
          echo "Cible DAST : https://$HOST"

      - name: Scanner le frontend avec OWASP ZAP
        id: zap
        continue-on-error: true
        shell: bash
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          mkdir -p zap-reports
          sudo chown 1000:1000 zap-reports
          chmod 700 zap-reports

          docker run --rm \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py \
              -t "$TARGET_URL" \
              -m 2 \
              -r zap-frontend-report.html \
              -J zap-frontend-report.json \
              -w zap-frontend-report.md

      - name: Publier le résultat DAST dans le Job Summary
        if: always()
        shell: bash
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          {
            echo "## DAST — OWASP ZAP"
            echo
            echo "**Cible :** $TARGET_URL"
            echo
            echo "**Politique :** informative — les alertes DAST doivent être revues avant de devenir bloquantes."
            echo
            echo "**Résultat du scanner :** `$ZAP_OUTCOME`"
            echo

            if [ -s zap-reports/zap-frontend-report.md ]; then
              sed -n '1,250p' zap-reports/zap-frontend-report.md
            else
              echo "Aucun rapport Markdown ZAP n'a été généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer les rapports ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-zap-frontend-report
          path: zap-reports/
          if-no-files-found: warn
