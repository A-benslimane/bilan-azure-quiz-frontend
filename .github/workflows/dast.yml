name: DAST - OWASP ZAP

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_URL: "https://ambitious-flower-025f74c03.5.azurestaticapps.net"

jobs:
  dast:
    name: DAST - OWASP ZAP Frontend Scan
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Vérifier que le frontend est disponible
        shell: bash
        run: |
          curl --fail --silent --show-error --location "$TARGET_URL" > /dev/null
          echo "Frontend disponible : $TARGET_URL"

      - name: Scanner le frontend avec OWASP ZAP
        id: zap
        continue-on-error: true
        shell: bash
        run: |
          sudo rm -rf zap-reports
          sudo install -d -o 1000 -g 1000 -m 755 zap-reports

          docker run --rm \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py \
              -t "$TARGET_URL" \
              -m 2 \
              -r zap-frontend-report.html \
              -J zap-frontend-report.json \
              -w zap-frontend-report.md

      - name: Publier le résultat DAST dans le Job Summary
        if: always()
        shell: bash
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          {
            echo "## DAST — OWASP ZAP"
            echo
            echo "**Cible :** $TARGET_URL"
            echo
            echo "**Politique :** informative — les alertes DAST doivent être revues avant de devenir bloquantes."
            echo
            echo "**Résultat du scanner :** $ZAP_OUTCOME"
            echo

            if [ -s zap-reports/zap-frontend-report.md ]; then
              sed -n '1,250p' zap-reports/zap-frontend-report.md
            else
              echo "Aucun rapport Markdown ZAP n'a été généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer les rapports ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-zap-frontend-report
          path: zap-reports/
          if-no-files-found: warn
